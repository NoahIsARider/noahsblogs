baseURL = 'https://example.com/'
locale = 'zh-CN'
title = 'Shibui Blogs'
enableRobotsTXT = true
hasCJKLanguage = true
summaryLength = 120

[module]
  [module.hugoVersion]
    extended = false
    min = '0.93.0'

[taxonomies]
  tag = 'tags'
  category = 'categories'

[permalinks]
  posts = '/posts/:slugorcontentbasename/'

[params]
  description = '一个适合长期维护的极简个人博客，用来记录研究、技术与日常思考。'
  comments = false
  showtoc = true
  showreadingtime = true
  showlastmod = true
  mainSections = ['posts']
  footerText = 'Built with Hugo. Ready for GitHub Pages and Vercel.'

  [params.author]
    name = 'Lenovo'
    email = ''

[markup]
  defaultMarkdownHandler = 'goldmark'
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    codeFences = true
    guessSyntax = true
    lineNos = false
    noClasses = true
    tabWidth = 4
    style = 'algol_nu'
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4
    ordered = true

[frontmatter]
  date = ['date', 'publishDate', 'lastmod']
  expiryDate = ['expiryDate']
  lastmod = [':git', 'lastmod', 'date', 'publishDate']
  publishDate = ['publishDate', 'date']

[outputs]
  home = ['HTML', 'RSS']
  section = ['HTML', 'RSS']
  taxonomy = ['HTML', 'RSS']

[menu]
  [[menu.main]]
    name = 'Home'
    pageRef = '/'
    weight = 10

  [[menu.main]]
    name = 'Posts'
    pageRef = '/posts'
    weight = 20

  [[menu.main]]
    name = 'Tags'
    pageRef = '/tags'
    weight = 30

  [[menu.main]]
    name = 'About'
    pageRef = '/about'
    weight = 40

